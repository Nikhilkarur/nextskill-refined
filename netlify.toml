[build]
  # No build step needed for static frontend
  command = ""
  publish = "frontend"

[[redirects]]
  # Proxy all /api/* requests to the backend
  from = "/api/*"
  to = "https://nextskill-refined3.onrender.com/api/:splat"
  status = 200
  force = true

# Hard-block internal/debug pages from being publicly accessible
[[redirects]]
  from = "/debug.html"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/demo.html"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/test-endpoint.html"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/auth-local.html"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/clear-data.html"
  to = "/404.html"
  status = 404

[build.environment]
  # Optional: set Node version if needed for any build tools
  NODE_VERSION = "18"

# Enable branch deploys for preview URLs
[context.branch-deploy]
  command = ""

# Production context
[context.production]
  command = ""